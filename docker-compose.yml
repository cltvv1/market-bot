services:
  postgres:
    image: postgres:16
    container_name: vitma_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASS:-pass}
      POSTGRES_DB: ${DB_NAME:-db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vitma_network

volumes:
  pgdata:

networks:
  vitma_network:
    driver: bridge
